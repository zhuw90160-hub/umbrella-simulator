<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同一把伞下 · 雨天小实验</title><style>
:root{--ink:#344c48;--muted:#82918a;--accent:#c47756}*{box-sizing:border-box}body{margin:0;background:#f5f3ec;color:var(--ink);font-family:system-ui,'Microsoft YaHei',sans-serif}main{max-width:1250px;margin:auto;padding:36px 32px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent)}h1{font-family:serif;font-size:35px;font-weight:500;margin:9px 0}header p{font-size:13px;color:var(--muted);margin:0}.tag{border:1px solid #d9ded4;border-radius:24px;padding:10px 16px;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px}.stage{background:#e6ede5;border-radius:20px;overflow:hidden;position:relative;border:1px solid #dce4d9}canvas{width:100%;display:block;aspect-ratio:800/620}.scene-title{position:absolute;top:23px;left:26px;font-size:11px;letter-spacing:2px;color:#688078}.scene-title strong{display:block;margin-top:8px;font-size:17px;letter-spacing:0;font-family:serif;font-weight:400}.weather{position:absolute;right:22px;top:25px;color:#688078;font-size:12px}.caption{background:#ffffff80;padding:17px 24px;font-size:13px;text-align:center;min-height:56px}.panel{background:#fffdf7;border:1px solid #e4e5db;border-radius:20px;padding:24px}h2{font-size:16px;font-weight:550;margin:0 0 20px}.control{margin:20px 0}.control label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px}.control output{color:var(--accent);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#7a9b88;cursor:pointer}select{width:100%;padding:10px;border:1px solid #dadfd4;border-radius:8px;background:#f5f4ed;color:var(--ink);font:inherit;font-size:13px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.person{background:#f2f1e9;padding:12px;border-radius:12px;font-size:12px}.person b{font-weight:500;display:block;margin-bottom:8px}.meter{height:5px;border-radius:3px;background:#dddcd2;overflow:hidden;margin:10px 0 6px}.fill{height:100%;transition:width .2s;background:#83a995}.small{font-size:11px;color:var(--muted)}button{font:inherit;cursor:pointer;border:1px solid #dddcd2;border-radius:9px;background:#fffdf8;color:var(--ink);padding:10px 12px;font-size:12px}button:hover{background:#eeeee4}button:focus-visible,input:focus-visible{outline:3px solid #c4775680;outline-offset:3px}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.primary{background:#344c48;color:#fff;border:0;width:100%;margin-top:12px}.primary:hover{background:#4b6961}footer{display:flex;justify-content:space-between;gap:16px;margin-top:19px;font-size:11px;color:#89958c}hr{border:0;border-top:1px solid #ecece2;margin:23px 0}.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.presets button{padding:7px 10px;font-size:11px}@media(max-width:800px){main{padding:22px 16px}.layout{grid-template-columns:1fr}.tag{display:none}h1{font-size:30px}.panel{padding:22px}canvas{aspect-ratio:800/620}footer{flex-direction:column}}
</style><main><header><div><div class="eyebrow">A LITTLE RAINY DAY EXPERIMENT</div><h1>同一把伞下</h1><p>雨再大一点，也可以靠近一点。</p></div><span class="tag">☂ 雨天互动模拟器</span></header><div class="layout"><section class="stage"><div class="scene-title">RAINY AFTERNOON<strong>两个人，一小片晴天。</strong></div><div class="weather" id="weather">微风 · 午后</div><canvas id="scene" width="800" height="620" aria-label="两个人撑伞的实时模拟画面"></canvas><div class="caption" id="caption" aria-live="polite"></div></section><aside class="panel"><h2>把雨天调成你的样子</h2><div class="pair"><div class="person"><b>● 人物 A</b><span id="statusA"></span><div class="meter"><div class="fill" id="fillA"></div></div><span class="small">遮雨率 <span id="rateA"></span></span></div><div class="person"><b style="color:#c47756">● 人物 B</b><span id="statusB"></span><div class="meter"><div class="fill" id="fillB"></div></div><span class="small">遮雨率 <span id="rateB"></span></span></div></div><div class="control"><label for="time">时间</label><select id="time"><option value="morning">清晨</option><option value="afternoon" selected>午后</option><option value="evening">傍晚</option><option value="night">夜晚</option></select></div><div class="control"><label for="background">背景</label><select id="background"><option value="street">街道</option><option value="park">公园</option><option value="campus">校园</option></select></div><div id="controls"></div><div class="actions"><button id="closer">靠近一点</button><button id="swap">交换位置</button></div><div class="actions"><button id="favorA">伞偏向人物 A</button><button id="favorB">伞偏向人物 B</button></div><hr><span class="small">换一个雨天</span><div class="presets"><button data-preset="gentle">一起躲雨</button><button data-preset="wind">突然起风</button><button data-preset="apart">隔着一点距离</button></div><button class="primary" id="reset">重新开始这个雨天 ↺</button></aside></div><footer><span>拖动滑块，看看风与距离如何改变这一小片晴天。</span><span>二维趣味模拟 · 遮雨率为简化估算</span></footer></main><script>
const defaults={ha:162,hb:182,gap:42,wind:10,tilt:0,bias:0,time:"afternoon",background:"street"};let state={...defaults},swapped=false;const configs=[['ha','人物 A的身高',140,200,'cm'],['hb','人物 B的身高',140,200,'cm'],['gap','两人的距离',24,125,'cm'],['wind','风向与风力',-60,60,''],['tilt','伞的倾斜',-35,35,'°'],['bias','伞的位置',-65,65,'']];document.querySelector('#controls').innerHTML=configs.map(([id,label,min,max,unit])=>`<div class="control"><label for="${id}">${label}<output id="${id}Value"></output></label><input id="${id}" type="range" min="${min}" max="${max}" value="${state[id]}"></div>`).join('');configs.forEach(([id])=>document.getElementById(id).addEventListener('input',e=>{state[id]=+e.target.value;sync()}));
document.getElementById('time').onchange=e=>{state.time=e.target.value;sync()};document.getElementById('background').onchange=e=>{state.background=e.target.value;sync()};
const timeLabels={morning:'清晨',afternoon:'午后',evening:'傍晚',night:'夜晚'};const palettes={morning:['#dce9e8','#f4f1dc','#c4d6cc','#ecf2df'],afternoon:['#e2ebe2','#f0eee0','#c4d3c3','#e8eee2'],evening:['#e8c6bd','#eed8bd','#bdaea4','#ffe2aa'],night:['#25394c','#536368','#3b505b','#f2d495']};
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let drops=Array.from({length:180},()=>({x:Math.random()*1000-100,y:Math.random()*620,s:Math.random()*1.5+1}));const ground=520,scale=1.75;
function geometry(){let xA=400-state.gap*scale/2,xB=400+state.gap*scale/2;if(swapped)[xA,xB]=[xB,xA];const top=ground-Math.max(state.ha,state.hb)*scale-32,cx=400+state.bias*1.5,angle=state.tilt*Math.PI/180;let points=[];for(let i=0;i<=60;i++){let x=-125+i*250/60,y=-64*Math.sqrt(Math.max(0,1-(x/125)**2));points.push({x:cx+x*Math.cos(angle)-y*Math.sin(angle),y:top+x*Math.sin(angle)+y*Math.cos(angle)})}return{xA,xB,cx,top,angle,points}}
function cross(a,b){return a.x*b.y-a.y*b.x}function blocked(x,y,g){const r={x:-state.wind/75,y:-1};for(let i=1;i<g.points.length;i++){const a=g.points[i-1],b=g.points[i],s={x:b.x-a.x,y:b.y-a.y},q={x:a.x-x,y:a.y-y},den=cross(r,s);if(Math.abs(den)<1e-9)continue;const t=cross(q,s)/den,u=cross(q,r)/den;if(t>=0&&u>=0&&u<=1)return true}return false}
function protection(x,h,g){let n=0,total=0;for(let i=0;i<11;i++){const dx=-23+i*4.6;n+=blocked(x+dx,ground-h*scale+8+Math.abs(dx)*.3,g)?1:0;total++;n+=blocked(x+dx,ground-h*scale+65,g)?1:0;total++}return Math.round(n/total*100)}
function sync(){document.getElementById('time').value=state.time;document.getElementById('background').value=state.background;document.querySelector('.scene-title').innerHTML=({morning:'RAINY MORNING',afternoon:'RAINY AFTERNOON',evening:'RAINY EVENING',night:'RAINY NIGHT'}[state.time])+'<strong>两个人，一小片晴天。</strong>';configs.forEach(([id,,, ,unit])=>{document.getElementById(id).value=state[id];let v=state[id]+(unit?' '+unit:'');if(id==='wind')v=state.wind===0?'无风':`${state.wind>0?'向右':'向左'} ${Math.abs(state.wind)}`;if(id==='bias')v=state.bias===0?'正中间':`${state.bias>0?'向右':'向左'} ${Math.abs(state.bias)}`;document.getElementById(id+'Value').textContent=v});let g=geometry(),a=protection(g.xA,state.ha,g),b=protection(g.xB,state.hb,g);['A','B'].forEach((p,i)=>{let v=i?b:a;document.getElementById('rate'+p).textContent=v+'%';document.getElementById('fill'+p).style.width=v+'%';document.getElementById('status'+p).textContent=v>=95?'好好地躲在伞下':v>=50?'肩膀有点湿了':'雨落在身上';});document.getElementById('caption').textContent=a>=95&&b>=95?'刚刚好。你们一起藏进了这小片晴天。':a<b?'人物 A这边漏雨了，试着把伞向人物 A挪一点。':b<a?'人物 B这边漏雨了，试着把伞向人物 B挪一点。':'雨有点不听话。靠近一点，或迎着风调整伞吧。';document.getElementById('weather').textContent=state.wind===0?`无风 · ${timeLabels[state.time]}`:`风往${state.wind>0?'右':'左'}吹 · ${timeLabels[state.time]}`}
function path(points,color,fill=false,width=2){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=width;if(fill){ctx.closePath();ctx.fillStyle=color;ctx.fill()}else ctx.stroke()}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function person(x,h,color,style,g){let y=ground-h*scale;ellipse(x,ground+5,37,7,'#748f7d20');path([{x:x-10,y:y+160},{x:x-12,y:ground-9}], '#485b59',false,15);path([{x:x+11,y:y+160},{x:x+15,y:ground-9}], '#485b59',false,15);round(x-25,y+49,50,h*scale-135,15,color);path([{x:x-25,y:y+68},{x:x-29,y:y+135}],color,false,14);path([{x:x+25,y:y+68},{x:x+29,y:y+132}],color,false,14);ellipse(x-29,y+140,6,8,'#ecd1b7');ellipse(x+29,y+139,6,8,'#ecd1b7');round(x-7,y+35,14,24,5,'#ecd1b7');ellipse(x,y+26,25,29,'#ecd1b7');ctx.beginPath();ctx.arc(x,y+20,26,Math.PI,Math.PI*2);ctx.lineTo(x+25,y+30);ctx.lineTo(x+15,y+13);ctx.lineTo(x-8,y+17);ctx.lineTo(x-24,y+31);ctx.fillStyle='#3e4944';ctx.fill();if(style===0)ellipse(x-23,y+39,8,19,'#3e4944');ellipse(x-8,y+29,1.6,2.3,'#43524a');ellipse(x+8,y+29,1.6,2.3,'#43524a');ellipse(x-14,y+37,4,2,'#d8988660');ellipse(x+14,y+37,4,2,'#d8988660');path([{x:x-4,y:y+41},{x:x,y:y+43},{x:x+4,y:y+41}],'#a27660',false,1.2);round(x-24,ground-9,22,10,4,'#374e47');round(x+5,ground-9,24,10,4,'#374e47');ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillStyle=state.time==='night'?'#e4e7d9':'#657d6e';ctx.fillText(style===0?'人物 A':'人物 B',x,ground+32);if(protection(x,h,g)<95){ellipse(x+29,y+86,3,5,'#8cabb3');ellipse(x-27,y+106,2,4,'#8cabb3')}}
let last=0;function frame(t){let dt=Math.min((t-last)/16.67,2)||1;last=t;let g=geometry();ctx.clearRect(0,0,800,620);let palette=palettes[state.time];let grad=ctx.createLinearGradient(0,0,0,620);grad.addColorStop(0,palette[0]);grad.addColorStop(1,palette[1]);ctx.fillStyle=grad;ctx.fillRect(0,0,800,620);if(state.time==='night'){ellipse(690,112,19,19,'#f4e4b5');ellipse(698,106,18,18,palette[0])}ctx.globalAlpha=.6;if(state.background==='street'){[80,160,635,717].forEach((x,i)=>{round(x,225+i%2*35,56,270,2,palette[2]);for(let k=0;k<4;k++)round(x+12,250+k*50+i%2*35,12,19,1,palette[3])})}else if(state.background==='park'){[95,175,640,725].forEach((x,i)=>{round(x-4,335,9,175,3,palette[2]);ellipse(x,320+i%2*24,44,62,state.time==='night'?'#375953':'#a3bba0');ellipse(x-20,352,31,37,state.time==='night'?'#42655a':'#b6c8a4')});round(595,471,125,9,3,palette[2]);round(608,480,7,33,2,palette[2]);round(700,480,7,33,2,palette[2])}else{round(72,310,655,187,4,palette[2]);for(let x=92;x<710;x+=45)for(let y of [333,382,431])round(x,y,24,28,2,palette[3]);ctx.fillStyle=palette[2];ctx.beginPath();ctx.moveTo(325,310);ctx.lineTo(400,257);ctx.lineTo(475,310);ctx.fill();ellipse(400,299,15,15,palette[3]);path([{x:400,y:288},{x:400,y:299},{x:408,y:303}],palette[2],false,2);round(370,449,60,48,2,palette[3])}ctx.globalAlpha=1;ellipse(398,534,232,17,'#becdc050');ellipse(150,558,54,4,'#afc5ba50');ellipse(655,560,60,5,'#afc5ba50');path([{x:90,y:521},{x:710,y:521}],'#b5c5b1',false,1);person(g.xA,state.ha,'#809e8a',0,g);person(g.xB,state.hb,'#bf8d72',1,g);
ctx.save();ctx.translate(g.cx,g.top);ctx.rotate(g.angle);path([{x:0,y:-52},{x:0,y:122},{x:0,y:135},{x:8,y:142},{x:17,y:138},{x:18,y:129}],'#64776b',false,4);ctx.restore();ctx.beginPath();g.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle='#cf8b6a';ctx.fill();path(g.points,'#b37457',false,2);for(let x of [-100,-50,0,50,100]){let p=g.points[Math.round((x+125)/250*60)];path([{x:g.cx+Math.sin(g.angle)*64,y:g.top-Math.cos(g.angle)*64},p],'#b3745760',false,1)}
for(let d of drops){d.y+=d.s*5*dt;d.x+=state.wind/75*d.s*5*dt;if(d.y>620||d.x>950||d.x<-150){d.y=-20;d.x=Math.random()*1000-100}if(!blocked(d.x,d.y,g)){path([{x:d.x,y:d.y},{x:d.x+state.wind/75*10,y:d.y+10}],'#87a69c60',false,1)}}requestAnimationFrame(frame)}
document.getElementById('closer').onclick=()=>{state.gap=Math.max(24,state.gap-12);sync()};document.getElementById('swap').onclick=()=>{swapped=!swapped;sync()};for(let p of ['A','B'])document.getElementById('favor'+p).onclick=()=>{let g=geometry();state.bias=Math.round(((p==='A'?g.xA:g.xB)-400)/1.5);state.bias=Math.max(-65,Math.min(65,state.bias));sync()};document.getElementById('reset').onclick=()=>{state={...defaults};swapped=false;sync()};document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{swapped=false;state={...defaults,...({gentle:{wind:0,gap:34},wind:{wind:55,tilt:0,gap:55},apart:{gap:110,wind:-18}}[b.dataset.preset])};sync()});sync();requestAnimationFrame(frame);
</script></html>
